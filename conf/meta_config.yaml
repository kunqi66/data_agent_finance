# 需要同步到meta库的指标信息
# 指标信息 =》保存到metric_info表
# metric_info的id和column_info的id => 保存到column_metric表中
metrics:
  - name: TRANSACTION_AMOUNT
    description: 交易金额，所有成功交易的金额总和。
    relevant_columns:
      - account_transaction.transaction_amount
    alias: [ 交易金额, 成交金额 ]

  - name: TRANSACTION_COUNT
    description: 交易笔数，成功交易的总笔数。
    relevant_columns:
      - account_transaction.id
    alias: [ 交易笔数, 交易次数 ]

  - name: TRANSACTION_FAILED_COUNT
    description: 失败交易笔数。
    relevant_columns:
      - account_transaction.id
    alias: [ 失败交易笔数 ]

  - name: ACCOUNT_ACTIVE_COUNT
    description: 正常账户数。
    relevant_columns:
      - bank_account.id
    alias: [ 正常账户数 ]

  - name: ACCOUNT_NEW_COUNT
    description: 新增账户数。
    relevant_columns:
      - bank_account.id
    alias: [ 新增账户数, 新开户数 ]

  - name: CUSTOMER_ACTIVE_COUNT
    description: 活跃客户数。
    relevant_columns:
      - customer.id
    alias: [ 活跃客户数 ]

  - name: CUSTOMER_NEW_COUNT
    description: 新增客户数。
    relevant_columns:
      - customer.id
    alias: [ 新增客户数 ]

  - name: LOAN_APPLICATION_COUNT
    description: 贷款申请数。
    relevant_columns:
      - loan_application.id
    alias: [ 贷款申请数, 申贷笔数 ]

  - name: LOAN_CONTRACT_ACTIVE_COUNT
    description: 有效贷款合同数。
    relevant_columns:
      - loan_contract.id
    alias: [ 有效贷款合同数, 在贷合同数 ]

  - name: LOAN_DISBURSE_AMOUNT
    description: 放款金额，成功放款金额总和。
    relevant_columns:
      - loan_disbursement.disbursement_amount
